---
- name: Refresh redhat cache
  ansible.builtin.dnf:
    update_cache: true
  when: ansible_os_family == "RedHat"

- name: Refresh debian cache
  ansible.builtin.apt:
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Refresh arch cache
  community.general.pacman:
    update_cache: true
  when: ansible_os_family == "Archlinux"
