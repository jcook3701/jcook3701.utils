---
- name: Configure Red Hat Repository
  ansible.builtin.template:
    src: redhat.repo.j2
    dest: "{{ repo_add_directory.sources }}/{{ repo_add_id }}.repo"
    owner: root
    group: root
    mode: "0644"
  notify: Refresh redhat cache
