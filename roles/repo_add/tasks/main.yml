---
- name: Load OS-specific variables for Repository Adder
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_facts['os_family'] | lower }}.yml"

- name: Validate orchestration variables before execution
  ansible.builtin.include_tasks: verify.yml

- name: Ensure repository pre-requisite packages are installed
  ansible.builtin.package:
    name: "{{ repo_add_pkg_names }}"
    state: present

- name: Prepare repositories for {{ ansible_distribution }}
  ansible.builtin.include_tasks: "{{ item }}"
  with_first_found:
    - "{{ ansible_os_family | lower }}.yml"
    - "repo/default.yml"
  when:
    - ansible_os_family in ['Debian', 'RedHat', 'Archlinux']`
