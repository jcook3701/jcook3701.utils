---
- name: Determine if target Debian/Ubuntu host uses legacy apt
  ansible.builtin.set_fact:
    repo_add_is_legacy_apt: "{{ true if (ansible_distribution == 'Ubuntu'
                                          and ansible_distribution_major_version | int < 20)
                                          or (ansible_distribution == 'Debian'
                                          and ansible_distribution_major_version | int < 11)
                                      else false }}"

- name: Purge Debian Legacy One-Line Repository file
  ansible.builtin.file:
    path: "{{ repo_add_directory.sources }}/{{ repo_add_id }}.list"
    state: absent
  become: true
  notify: "Refresh debian cache"
  when: repo_add_is_legacy_apt | bool

- name: Purge Debian DEB822 Repository Source File
  ansible.builtin.file:
    path: "{{ repo_add_directory.sources }}/{{ repo_add_id }}.sources"
    state: absent
  become: true
  notify: "Refresh debian cache"
  when: not repo_add_is_legacy_apt | bool

- name: Purge Associated Cryptographic GPG Validation Keyring
  ansible.builtin.file:
    path: "{{ repo_add_directory.keyrings }}/{{ repo_add_id }}.{{ repo_add_key_format }}"
    state: absent
  become: true
  notify: "Refresh debian cache"
  loop:
    - asc
    - gpg
  loop_control:
    loop_var: repo_add_key_format
    label: "Removing Signing Key: {{ repo_add_id }}.{{ repo_add_key_format }}"
