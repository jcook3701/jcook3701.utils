---
- name: Purge Arch Linux Custom Repo Template Configuration File
  ansible.builtin.file:
    path: "{{ repo_add_directory.sources }}/{{ repo_add_id }}.conf"
    state: absent
  become: true
  notify: "Refresh arch cache"
