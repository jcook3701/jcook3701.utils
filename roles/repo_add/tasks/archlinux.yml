---
- name: Ensure Arch Linux custom folder structure exists
  ansible.builtin.file:
    path: "{{ repo_add_directory.sources }}"
    state: directory
    owner: root
    group: root
    mode: "0775"

- name: Configure Arch Linux Custom Repository
  ansible.builtin.template:
    src: arch.conf.j2
    dest: "{{ repo_add_directory.sources }}/{{ repo_add_id }}.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Refresh arch cache
