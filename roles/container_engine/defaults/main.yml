---
# The path containing the targeted composition file setup
container_engine_project_src: "/opt/container-stack"

# Target runtime context choice engine parameter definitions
# Choices: "docker", "podman"
container_engine_platform_type: "docker"

# Deployment lifecycle framework state controls
# Choices: "present", "absent", "teardown"
container_engine_desired_state: "present"

# Metric gate tracking validation requirements before modification actions
container_engine_trigger_condition: true

# Control handling choices during container update checks
container_engine_pull_images: true
