---
galaxy_info:
  author: Jared Cook
  description: >-
    This role provides an on-demand dispatcher pattern allowing orchestrators
    to safely trigger specific baseline administrative utilities via variable toggles.
  company: "Cook's Code, Inc."
  license: "AGPL-3.0-or-later"
  min_ansible_version: ">=2.10"
  role_name: general

  platforms:
    - name: EL
      versions:
        - "8"
        - "9"
    - name: Debian
      versions:
        - all
    - name: Ubuntu
      versions:
        - all

  galaxy_tags:
    - homelab
    - desktop
    - server
    - apps

dependencies: []

collections:
  - "community.crypto"
