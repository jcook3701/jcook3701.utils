---
- name: Forcefully remove targeted user profile and wipe home folder spaces
  ansible.builtin.user:
    name: "{{ user_name }}"
    state: "absent"
    remove: true

- name: Purge associated passwordless sudoers authorization snippet file
  ansible.builtin.file:
    path: "{{ user_file.sudoers }}"
    state: absent
  become: true
