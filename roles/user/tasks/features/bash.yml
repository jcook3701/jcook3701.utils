---
- name: Deploy tailored user shell initialization profiles
  ansible.builtin.template:
    src: "bashrc.j2"
    dest: "{{ user_file.bashrc }}"
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0644"
