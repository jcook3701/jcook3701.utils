---
- name: Ensure target POSIX user account is present on system
  ansible.builtin.user:
    name: "{{ user_name }}"
    uid: "{{ user_uid | default(omit) }}"
    group: "{{ user_gid | default(omit) }}"
    groups: "{{ user_groups }}"
    append: true
    shell: "{{ user_shell }}"
    home: "{{ user_home | default('/home/' + user_name) }}"
    state: "present"
  register: system_user_created

- name: Enforce passwordless privilege escalation for management user
  ansible.builtin.copy:
    content: "{{ user_name }} ALL=(ALL) NOPASSWD:ALL"
    dest: "{{ user_file.sudoers }}"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  become: true
