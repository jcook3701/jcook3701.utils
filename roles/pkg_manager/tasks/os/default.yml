---
- name: Manage repository packages via generic package module
  ansible.builtin.package:
    name: "{{ pkg_manager_pkgs | reject('match', pkg_manager_file_regex) | list }}"
    state: "{{ pkg_manager_state }}"
  when: (pkg_manager_pkgs | reject('match', pkg_manager_file_regex) | list | length) > 0

- name: Install local packages via generic package module
  ansible.builtin.package:
    name: "{{ package }}"
    state: "{{ pkg_manager_state }}"
  loop: "{{ pkg_manager_pkgs | select('match', pkg_manager_file_regex) | list }}"
  loop_control:
    loop_var: "package"
    label: "{{ package }}"
  when:
    - pkg_manager_state in ['present', 'latest']
    - (pkg_manager_pkgs | select('match', pkg_manager_file_regex) | list | length) > 0
